<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Prog 3: Transforms and Lighting</title>
    <style>
      body { font-family: sans-serif; }
      #controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; margin-bottom: 8px; }
      fieldset { padding: 2px 8px 6px; }
      input[type=number] { width: 60px; }
      #help { font-size: 13px; line-height: 1.6; }
    </style>

    <script type="text/javascript" src="gl-matrix-min.js"></script>
    <script type="text/javascript" src="rasterize.js"></script>
  </head>

  <body onload="main();">
    <div id="controls">
      <fieldset>
        <legend>Canvas (viewport)</legend>
        <label>width <input type="number" id="canvasWidth" value="512" min="1"></label>
        <label>height <input type="number" id="canvasHeight" value="512" min="1"></label>
      </fieldset>
      <fieldset>
        <legend>Window (view space)</legend>
        <label>left <input type="number" id="winLeft" value="-0.5" step="0.05"></label>
        <label>right <input type="number" id="winRight" value="0.5" step="0.05"></label>
        <label>bottom <input type="number" id="winBottom" value="-0.5" step="0.05"></label>
        <label>top <input type="number" id="winTop" value="0.5" step="0.05"></label>
      </fieldset>
      <button id="applyView">Apply</button>
      <fieldset>
        <legend>Shading</legend>
        <label><input type="checkbox" id="useLighting" checked> lighting</label>
        <label><input type="checkbox" id="useVertexNormals" checked> vertex normals</label>
      </fieldset>
    </div>
    <canvas id="myWebGLCanvas" width="512" height="512"></canvas>
    <div id="help">
      View: a/d left/right, w/s forward/back, q/e up/down, A/D yaw left/right, W/S pitch down/up.<br>
      Select: &larr;/&rarr; previous/next model, space to deselect.<br>
      Selected model: k/; left/right, o/l forward/back, i/p up/down, K/: yaw, O/L pitch, I/P roll.
    </div>
  </body>
</html>
